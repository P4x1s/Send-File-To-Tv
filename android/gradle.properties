org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# 代理不在此处硬编码：沙箱代理端口会随会话漂移，写死会导致构建期
# "Connect to 127.0.0.1:xxxxx failed: Connection refused"。
# 由 build/build.sh 在构建前探测环境变量中的代理是否可用：
#   可用 -> 通过 -Dhttp(s).proxyHost/Port 注入
#   不可用 -> 直连（dl.google.com / repo.maven.apache.org 实测均可直连）
